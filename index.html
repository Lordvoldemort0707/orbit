<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbit</title>
  <meta name="description" content="Orbit is your personal life dashboard: tasks, habits, a focus timer, a day planner, notes and a journal, all on your device.">
  <meta name="theme-color" content="#f6f6f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orbit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* set the theme before first paint, so a dark-mode user never sees a white flash */
    try {
      var s = JSON.parse(localStorage.getItem('orbit.v1') || '{}'), t = s.settings && s.settings.theme;
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      var a = localStorage.getItem('orbit.accent'); if (a) document.documentElement.style.setProperty('--accent', a);
      if (s.settings && s.settings.headings === 'sans') document.documentElement.dataset.headings = 'sans';
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/today" id="brand"></a>
      <div id="navs"></div>
      <div class="side-bottom">
        <a class="nav-item" href="#/settings" data-route="settings" id="nav-settings"></a>
        <a class="user-row" href="#/settings" id="user-row"></a>
      </div>
    </aside>

    <header class="topbar">
      <div class="left" id="top-left"></div>
      <button type="button" class="search-btn" id="search-btn" aria-label="Search or run a command"></button>
      <div class="top-right">
        <a class="timer-chip" id="timer-chip" href="#/focus" aria-live="off"></a>
        <button type="button" class="icon-btn kbd-btn" id="keys-btn" aria-label="Keyboard shortcuts"></button>
        <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch light or dark theme"></button>
      </div>
    </header>

    <main class="sheet" id="sheet">
      <div class="canvas" id="view" tabindex="-1"></div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">Orbit needs JavaScript turned on.</p></noscript>

  <script src="js/charts.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/life.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/focus.js"></script>
  <script src="js/views/planner.js"></script>
  <script src="js/views/notes.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/money.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
